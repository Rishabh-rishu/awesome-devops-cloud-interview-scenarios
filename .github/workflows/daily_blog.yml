name: Autonomous Daily DevOps Blogger

on:
  schedule:
    # Runs every day at 04:30 UTC (10:00 AM IST)
    - cron: '30 4 * * *'
  workflow_dispatch:

jobs:
  publish-article:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Autonomous Blogger
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: |
          python auto_blogger.py

      - name: Commit & Push Topic State
        run: |
          git config user.name "Intervixa-Blogger-Bot"
          git config user.email "bot@intervixa.online"
          git add last_posted_index.txt || true
          git commit -m "chore: advance auto-blog rotation index [skip ci]" || true
          git push || true
